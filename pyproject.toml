[project]
name = "video-qa"
version = "0.1.0"
description = "Automatická kontrola kvality videí (ffprobe/ffmpeg) bez AI agenta"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
video-qa = "video_qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_qa = ["default_spec.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: testy generující video přes ffmpeg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
